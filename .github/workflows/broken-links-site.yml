name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

jobs:
  check-links-on-site:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby # latest stable; avoids exact-patch pins that new runner images drop
          bundler-cache: true
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # Only check local links. --root-dir resolves root-relative links ("/news/") against _site;
          # --fallback-extensions mirrors GitHub Pages serving /hiring/foo from hiring/foo.html.
          # The excluded CaptainCook4D webp srcset is emitted by al_folio_core for the animated GIF
          # project card (ImageMagick does not convert GIFs); the card's onerror falls back to the GIF.
          args: >-
            --offline
            --root-dir ${{ github.workspace }}/_site
            --fallback-extensions html
            --exclude 'publication_preview/CaptainCook4D-[0-9]+\.webp$'
            --no-progress
            '_site/**/*.html'
